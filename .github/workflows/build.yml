name: Gerar executáveis do downow

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            nome: linux
            arquivo: dist/downow
            artefato: downow-linux-x86_64
          - os: windows-latest
            nome: windows
            arquivo: dist/downow.exe
            artefato: downow-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas do Qt (Linux)
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3 libfontconfig1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar o executável
        run: python build.py

      - name: Autoteste (Linux)
        if: matrix.nome == 'linux'
        run: ./dist/downow --selftest

      - name: Autoteste (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\downow.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Autoteste falhou (código $($p.ExitCode))" }

      - name: Renomear
        shell: bash
        run: cp "${{ matrix.arquivo }}" "${{ matrix.artefato }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: ${{ matrix.artefato }}

      - name: Publicar na Release (só quando há tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artefato }}
